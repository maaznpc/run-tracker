name: Android checks and APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**' 
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Bundle official MediaPipe model
        run: |
          python3 scripts/fetch_model.py
          curl --fail --location --retry 2 --max-time 120 https://storage.googleapis.com/mediapipe-assets/pose.jpg -o app/src/androidTest/assets/pose.jpg
      - name: Core signal checks
        run: bash scripts/test-core.sh
      - name: Build, test and lint
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Print lint diagnostics on failure
        if: failure()
        run: |
          python3 - <<'PYLINT'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('app/build/reports/lint-results-debug.xml')
          if path.exists():
              for issue in ET.parse(path).getroot():
                  if issue.attrib.get('severity') in ('Error', 'Fatal'):
                      print(issue.attrib)
                      for location in issue.findall('location'): print(location.attrib)
          PYLINT
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and test on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew connectedDebugAndroidTest --no-daemon
            adb pull /sdcard/Pictures/Stride-Verification verification-screenshots
      - name: Verify APK signature, model and permissions
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee docs/apk-signature.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$apk" > docs/apk-manifest.xml
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest permissions "$apk" > docs/apk-permissions.txt
          sha256sum "$apk" > docs/apk.sha256
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import io, zipfile, xml.etree.ElementTree as ET
          apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          ns = '{http://schemas.android.com/apk/res/android}'
          manifest = ET.parse('docs/apk-manifest.xml').getroot()
          assert manifest.attrib['package'] == 'com.stride.form'
          launchers = []
          for activity in manifest.findall('application/activity'):
              for intent in activity.findall('intent-filter'):
                  actions = {x.attrib[ns+'name'] for x in intent.findall('action')}
                  categories = {x.attrib[ns+'name'] for x in intent.findall('category')}
                  if 'android.intent.action.MAIN' in actions and 'android.intent.category.LAUNCHER' in categories:
                      launchers.append(activity.attrib[ns+'name'])
          assert len(launchers) == 1 and launchers[0].endswith('.MainActivity'), launchers
          sdk = manifest.find('uses-sdk')
          assert sdk.attrib[ns+'minSdkVersion'] == '26'
          assert sdk.attrib[ns+'targetSdkVersion'] == '35'
          permissions = {p.attrib[ns+'name'] for p in manifest.findall('uses-permission')}
          assert 'android.permission.CAMERA' in permissions
          assert 'android.permission.INTERNET' not in permissions
          assert 'android.permission.RECORD_AUDIO' not in permissions
          with zipfile.ZipFile(apk) as package:
              assert package.testzip() is None
              model = package.read('assets/pose_landmarker_lite.task')
              assert len(model) > 1_000_000
              with zipfile.ZipFile(io.BytesIO(model)) as task:
                  assert task.testzip() is None
                  assert sum(p.endswith('.tflite') for p in task.namelist()) >= 2
              assert any(p.startswith('lib/arm64-v8a/') and p.endswith('.so') for p in package.namelist())
          print('PASS: APK identity, SDK levels, private permissions, native library and bundled pose model')
          PYVERIFY
          echo 'APK built, unit tested, linted, installed and tested on Android 15 emulator, with signature/package verification. Physical-phone camera validation remains separate.' >> "$GITHUB_STEP_SUMMARY"
          cat docs/apk.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Stride-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Verification-reports
          path: |
            app/build/reports
            docs/pose-model.sha256
            docs/apk-signature.txt
            docs/apk-manifest.xml
            docs/apk-permissions.txt
            docs/apk.sha256
            verification-screenshots
            app/build/outputs/androidTest-results
